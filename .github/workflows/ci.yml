name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  python-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shopscale
          POSTGRES_PASSWORD: shopscale
          POSTGRES_DB: shopscale
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopscale -d shopscale"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      zookeeper:
        image: confluentinc/cp-zookeeper:7.7.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        ports:
          - 2181:2181
      kafka:
        image: confluentinc/cp-kafka:7.7.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        ports:
          - 9092:9092
        options: >-
          --health-cmd "kafka-broker-api-versions --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql+psycopg://shopscale:shopscale@localhost:5432/shopscale
      TEST_DATABASE_URL: postgresql+psycopg://shopscale:shopscale@localhost:5432/shopscale
      RUN_POSTGRES_TESTS: "1"
      RUN_REDIS_TESTS: "1"
      REDIS_URL: redis://localhost:6379
      KAFKA_BROKERS: localhost:9092
      JWT_ACCESS_SECRET: ci-access-secret-that-is-long-enough
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-long-enough

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r apps/backend/requirements.txt

      - name: Run Python tests
        run: PYTHONPATH=apps/backend pytest -q apps/backend/tests

      - name: Verify Alembic migrations
        run: cd apps/backend && python -m alembic upgrade head

      - name: Build Python backend image
        run: docker build -f apps/backend/Dockerfile --target production -t shopscale-backend:ci .

      - name: Build frontend image
        run: docker build -f apps/frontend/Dockerfile --target production -t shopscale-frontend:ci .
